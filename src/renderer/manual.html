<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>输入文本翻译</title>
</head>
<body class="manual-page">
  <main class="manual-shell">
    <header class="manual-head">
      <div class="manual-brand">
        <span class="brand-mark">译</span>
        <span>文本翻译</span>
      </div>
      <div class="manual-head-actions">
        <label class="language-picker" for="manual-target">
          <span>译为</span>
          <select id="manual-target">
            <option>简体中文</option>
            <option>繁體中文</option>
            <option>英语</option>
            <option>日语</option>
            <option>韩语</option>
            <option>法语</option>
            <option>德语</option>
            <option>西班牙语</option>
            <option>葡萄牙语</option>
            <option>俄语</option>
            <option>意大利语</option>
          </select>
        </label>
        <button class="icon-btn manual-settings" id="settings" type="button" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="manual-body">
      <div class="manual-section">
        <div class="manual-section-head">
          <label for="manual-source">原文</label>
          <span id="character-count">0 / 50000</span>
        </div>
        <textarea
          id="manual-source"
          maxlength="50000"
          placeholder="在这里输入需要翻译的文本…"
          spellcheck="false"
          autofocus
        ></textarea>
      </div>

      <div class="manual-section result-section">
        <div class="manual-section-head">
          <span>译文</span>
          <button class="text-button compact" id="copy" type="button" disabled>复制译文</button>
        </div>
        <div class="manual-result placeholder" id="manual-result">译文将在这里显示</div>
      </div>
    </section>

    <footer class="manual-foot">
      <div class="manual-status" id="manual-status">Ctrl + Enter 快速翻译</div>
      <div class="manual-actions">
        <button class="secondary" id="clear" type="button">清空</button>
        <button class="primary" id="translate-text" type="button">翻译</button>
      </div>
    </footer>
  </main>
  <script src="manual.js"></script>
</body>
</html>
