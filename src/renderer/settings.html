<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>Luma Translate 设置</title>
</head>
<body class="settings-page">
  <main class="settings-shell">
    <header class="settings-head">
      <h1>设置</h1>
      <p>LLM 翻译服务</p>
    </header>
    <form class="settings-form" id="form">
      <div class="field">
        <label for="endpoint">API 地址</label>
        <input id="endpoint" name="endpoint" type="url" required placeholder="https://api.openai.com/v1">
        <p class="hint">支持 OpenAI 兼容接口，应用会请求 /chat/completions。</p>
      </div>
      <div class="field">
        <label for="apiKey">API Key</label>
        <input id="apiKey" name="apiKey" type="password" autocomplete="off" placeholder="保持留空则不修改">
        <p class="hint" id="keyHint">Key 会使用系统安全存储加密保存在本机。</p>
      </div>
      <div class="field">
        <label for="model">模型</label>
        <input id="model" name="model" required placeholder="gpt-4.1-mini">
      </div>
      <div class="row">
        <div class="field">
          <label for="sourceLanguage">源语言</label>
          <select id="sourceLanguage" name="sourceLanguage">
            <option>自动检测</option><option>简体中文</option><option>英语</option>
            <option>日语</option><option>韩语</option><option>法语</option><option>德语</option>
          </select>
        </div>
        <div class="field">
          <label for="targetLanguage">目标语言</label>
          <select id="targetLanguage" name="targetLanguage">
            <option>简体中文</option><option>英语</option><option>日语</option>
            <option>韩语</option><option>法语</option><option>德语</option><option>西班牙语</option>
          </select>
        </div>
      </div>
      <label class="checkbox">
        <input id="launchAtLogin" name="launchAtLogin" type="checkbox">
        <span>登录系统时自动启动</span>
      </label>
    </form>
    <footer class="settings-foot">
      <span class="save-status" id="status"></span>
      <button class="primary" id="save" type="submit" form="form">保存设置</button>
    </footer>
  </main>
  <script src="settings.js"></script>
</body>
</html>
